<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#180f2b">
  <meta name="description" content="Choose a reading assessment in the Mystica story library.">
  <title>Mystica | Reading Assessments</title>
  <link rel="stylesheet" href="mystica.css">
</head>
<body>
  <main class="library" aria-labelledby="library-title">
    <section class="story-picker">
      <header class="introduction">
        <p class="project-name"><span aria-hidden="true">✦</span> Reading Assessments</p>
        <h1 id="library-title">Mystica</h1>
        <p class="invitation">Choose a story to begin.</p>
      </header>

      <nav class="story-list" aria-label="Choose a story">
        <a class="story-card trail" href="mountain-biking/index.html">
          <img src="mountain-biking/assets/cover.webp" alt="">
          <span class="story-name">Mountain Biking</span>
          <span class="story-arrow" aria-hidden="true">→</span>
        </a>
        <a class="story-card ocean" href="swimming-with-turtles/index.html">
          <img src="swimming-with-turtles/assets/cover.webp" alt="">
          <span class="story-name">Swimming with Turtles</span>
          <span class="story-arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </section>

    <figure class="illustration">
      <img src="assets/mystica-library.png" alt="A child reads a glowing book in an enchanted library.">
    </figure>
  </main>
</body>
</html>
